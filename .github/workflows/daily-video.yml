name: Publicar video diario

on:
  schedule:
    - cron: "0 14 * * *"  # 14:00 UTC todos los días
  workflow_dispatch: {}    # permite disparo manual desde la pestaña Actions

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pipeline y publicar
        env:
          HF_SCRIPT_MODEL: ${{ vars.HF_SCRIPT_MODEL }}
          HF_TTS_MODEL: ${{ vars.HF_TTS_MODEL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          cd scripts
          python run_pipeline.py

      - name: Subir logs como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: logs/
          retention-days: 14
